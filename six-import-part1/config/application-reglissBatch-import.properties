# =============================================================================
# SIX import (part 1) - add to the reglissBatch profile properties
# =============================================================================

# Spring Boot 2.7 runs ALL @Scheduled methods on ONE thread by default. The
# instrument, structure and options pollers share the same cron, so today on one
# server the second file waits until the first file is completely imported.
# With a pool, each poller gets its own thread and the files import in parallel.
spring.task.scheduling.pool.size=8
spring.task.scheduling.thread-name-prefix=regliss-sched-

# Connections: up to 3 files in parallel x 4 writer threads + progress updates
# + the web/other pollers. Hikari's default (10) would make writers queue.
# Check the DBA's per-schema session limit before raising further.
spring.datasource.hikari.maximum-pool-size=20

# Existing keys - unchanged.
six.db.batch=1000
automatic.import.db.thread.pool.size=4

# Fail the import (and remove its partial rows) if any batch could not be saved.
six.import.fail-on-batch-error=true

# Only needed if the application user is NOT the owner of the SIX tables (synonyms).
# Otherwise the identity sequence of each table is found automatically.
# six.import.id-sequence.SIX_INSTRUMENTS=OWNER.ISEQ$$_12345
# six.import.id-sequence.SIX_STRUCTURED=OWNER.ISEQ$$_12346
# six.import.id-sequence.SIX_OPTION=OWNER.ISEQ$$_12347
# six.import.id-sequence.SIX_TARGET=OWNER.ISEQ$$_12348
