#database configuration
#H2 seems to be slower than HSQLDB so in hope of increasing a bit the speed we did some performance tuning
#by enabling some H2 specific flags in the jdbc url.
#H2 runs in embedded in memory named mode now, meaning that each new connection will connect to the same DB.
#If we specify a name like jdbc:h2:mem:, H2 will run in private mode meaning that each new connection will be initiated
#to a separate db. Previous to spring boot H2 worked best in private mode but after migrating to spring boot it seems
#it works better with in memory named mode. In private mode some integration tests that were using
# com.bnpp.regliss.repository.AbstractNonTransactedRepositoryTestBase as base class were failing with Version table not found
# probably because they tried to initiate a new connection and H2 will generate a new DB that was not initialized properly.


spring.datasource.url=jdbc:h2:mem:test;EARLY_FILTER=true;CACHE_SIZE=100000;DB_CLOSE_DELAY=-1;MODE=Oracle;INIT=RUNSCRIPT FROM 'classpath:h2-specific.sql'
spring.datasource.driver-class-name=org.h2.Driver
#p6spy debug queries params url:
#spring.datasource.url=jdbc:h2:mem:;EARLY_FILTER=true;CACHE_SIZE=100000;DB_CLOSE_DELAY=-1;MODE=Oracle;INIT=RUNSCRIPT FROM 'classpath:h2-specific.sql'

spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
spring.jpa.properties.hibernate.id.new_generator_mappings=false

#logging.level.org.hibernate.tool.hbm2ddl=TRACE
#logging.level.org.hibernate.type.descriptor.sql=trace
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.check_nullability=false
spring.jpa.hibernate.ddl-auto=create-drop
