# =============================================================================
# SIX export (part 3, export phase 1, part 4 cleanup, performance) - reglissBatch profile.
# Every key is optional (default shown) except the Hikari typo fix at the end.
# Existing keys used unchanged: task.batch.export.generation, allow.six.file.integration,
# automatic.import.IN.directory, automatic.import.xsd.CUSTOM_AUTOMATIC, six.cmic.list, six.e014071.list,
# six.exclusion.list.
# =============================================================================

# Holding folder of the CONVERTER files until every list of the delivery is finished.
# Empty = folder "six-export-holding" next to the DJ IN folder. Must be on the same mount as DJ IN, seen by
# both batch servers, and NOT inside DJ IN.
six.export.holding.directory=

# How often a regeneration re-checks whether the automatic export of the same list + raw version is finished.
six.export.regeneration.wait.millis=60000

# Rows per round trip of the filter reads (writes are not concerned). Raise only if the batch heap allows it.
six.export.filter.fetch.size=500

# Keep-alive of the jobs and BUILDING rows while a CONVERTER file is built.
six.export.build.keepalive.seconds=60
six.export.build.keepalive.max.minutes=120

# Nightly cleanup: ticks at 02:00, 02:15, 02:30, 02:45 (later ticks only used when no alive batch server was found).
# Choose a time outside the SIX import / export slots.
task.six.cleanup.cron=0 0/15 2 * * *
# Rows per DELETE chunk of the cleanup (raw tables, and filtered tables when TRUNCATE is refused).
six.cleanup.delete.chunk.size=2000

# Typo fix of an EXISTING key (application.properties has "leak-detection-threashold", ignored by Hikari):
# replace that line by this one. Logs a stack trace for a connection held longer than 63 s (warning only;
# long filter queries can also be logged - check in the lower environment first).
spring.datasource.hikari.leak-detection-threshold=63000
